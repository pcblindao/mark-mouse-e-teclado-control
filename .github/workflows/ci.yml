name: Mark Mouse e Teclado Control

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: markcontrol --help
      - run: python -m pytest -q

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/build.ps1
      - name: Preparar Inno Setup no runner
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and
              -not (Test-Path 'C:\Program Files\Inno Setup 6\ISCC.exe') -and
              -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
              choco install innosetup --yes --no-progress --limit-output
              if ($LASTEXITCODE -ne 0) { throw 'Inno Setup não foi instalado no runner.' }
          }
      - name: Compilar Setup Windows real
        shell: pwsh
        run: ./scripts/build-installer.ps1 -AppExe 'dist\Mark Mouse e Teclado Control.exe'
      - name: Validar instalação, reinstalação e instância única
        shell: pwsh
        run: |
          $version = (python -c "from markcontrol.version import __version__; print(__version__)").Trim()
          ./scripts/check_setup_install.ps1 -SetupExe "dist\MarkMouseTecladoControl-Setup-$version.exe"
      - name: Guardar logs do teste de instalação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-smoke-logs
          path: ${{ runner.temp }}/markcontrol-setup-*/setup-*.log
          if-no-files-found: ignore
